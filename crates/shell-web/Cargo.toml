# crates/shell-web/Cargo.toml
[package]
name = "shell-web"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["web"]
# Keep the shared App/route graph renderer-neutral for desktop/mobile. Native
# shells disable this default and select their own Dioxus renderer directly.
web = ["dioxus/web"]

[dependencies]
chrono = { workspace = true, features = ["std", "clock", "wasmbind"] }
dioxus = { workspace = true }
dioxus-router = { workspace = true }
features-auth = { path = "../features-auth" }
features-courses = { path = "../features-courses" }
design-system = { path = "../design-system" }
core-types = { path = "../core-types" }
platform-bridge = { path = "../platform-bridge" }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
gloo-timers = { version = "0.3", features = ["futures"] }
# "console" is used directly by this crate (the lobby poll logs an unrecognised
# session state). web-sys gates each type behind a feature of the same name, so
# declare it here rather than inheriting it from features-courses by workspace
# feature unification.
web-sys = { version = "0.3", features = ["Window", "console", "Storage", "Location", "Navigator", "History"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
dioxus = { workspace = true, features = ["web"] }
dioxus-ssr = "=0.7.10"
features-courses = { path = "../features-courses" }
core-types = { path = "../core-types" }

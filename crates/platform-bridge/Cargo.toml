# crates/platform-bridge/Cargo.toml
[package]
name = "platform-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1"
thiserror = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Storage"] }

# Native (desktop/mobile) auth bridge deps. Gated so the wasm bundle is
# unaffected. Mirrors the workspace reqwest features (json + rustls-tls).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
directories = "6"
keyring-core = "1.0.0"
uuid = { workspace = true }
sha2 = { workspace = true }
url = "2"
webbrowser = "1.2.1"

# Native desktop save dialogs. Mobile exports use the app-private export
# directory and hand the path to the platform share hook instead.
[target.'cfg(any(windows, target_os = "macos", target_os = "linux"))'.dependencies]
rfd = "0.17.2"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "1.1.0"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
apple-native-keyring-store = { version = "1.0.0", default-features = false, features = ["keychain", "protected"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.0", features = ["rt-tokio-crypto-rust"] }

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "1.0.0"
jni = "0.21"
ndk-context = "0.1"

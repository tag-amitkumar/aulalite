# ops/mediamtx/hls-gateway.conf
#
# Thin front door for the public HLS hostname (stream.elementors.guru).
#
# WHY THIS EXISTS
# MediaMTX serves HLS per session path (`/<path>/index.m3u8`) and has no concept
# of a site root, so `GET /` hits gin's no-route handler and returns an 18-byte
# `404 page not found`. That is CORRECT behaviour, but it is indistinguishable
# from "the tunnel is misrouted" or "the origin is down", which has cost real
# debugging time. This gateway answers exactly `/` (and `/healthz`) with a
# machine-readable status telling the caller the server is up and that playback
# needs a session playlist, and proxies literally everything else to MediaMTX
# untouched.
#
# WHAT IT MUST NOT DO
# It sits in the live media path, so it must not buffer. MediaMTX runs
# `hlsVariant: lowLatency`, which depends on chunked transfer for partial
# segments and on blocking playlist reloads that legitimately hang for seconds.
# nginx's default proxy buffering would defeat both, turning low-latency HLS
# into stuttering high-latency HLS. Hence `proxy_buffering off`, HTTP/1.1, and
# a read timeout well above the blocking-reload window.
#
# It also must not invent CORS headers: MediaMTX already emits them from
# `hlsAllowOrigins` (driven by AULALITE_BROWSER_ORIGINS), and a second set would
# produce a duplicated `Access-Control-Allow-Origin`, which browsers reject.

server {
    listen 8888;
    server_name _;

    # Never buffer a media response to disk, and do not cap its size.
    proxy_buffering          off;
    proxy_request_buffering  off;
    proxy_max_temp_file_size 0;
    proxy_http_version       1.1;

    # LL-HLS blocking playlist reloads hold the request open until the next
    # part is ready. Keep well clear of that so nginx never cuts one short.
    proxy_read_timeout    75s;
    proxy_send_timeout    75s;
    proxy_connect_timeout 5s;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # MediaMTX decides CORS from the request Origin; it must survive the hop.
    proxy_set_header Origin            $http_origin;
    proxy_set_header Connection        "";

    # EXACT match only. `location = /` cannot shadow `/<path>/index.m3u8`,
    # `/<path>/<variant>_stream.m3u8`, segment requests, or MediaMTX's own
    # per-path player page - every one of those has a longer URI and falls
    # through to the proxy below.
    location = / {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 200 '{"service":"aulalite-hls","status":"ok","message":"HLS server is reachable. Playback requires a session playlist, not this root path.","playlist":"/aula/<tenant>/<course>/<session>/index.m3u8?jwt=<viewer_jwt>","hint":"Obtain the playlist URL and viewer JWT from POST /v1/sessions/<id>/join on the AulaLite API."}\n';
    }

    # Liveness for the gateway itself. Deliberately NOT proxied: it answers
    # even when MediaMTX is down, which is what makes it useful for telling
    # "tunnel/origin reachable" apart from "media server dead".
    location = /healthz {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 200 '{"service":"aulalite-hls","status":"ok"}\n';
    }

    # Everything else is MediaMTX's, verbatim.
    location / {
        proxy_pass http://mediamtx:8888;
    }
}
